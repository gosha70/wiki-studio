name: Review gate

# A pull request merges only after the external review of its head commit is on
# record. The owner adds the `reviewed` label once the reviewer has passed the
# current head; any new commit removes the label. The job sets the commit status
# "External review on record" on the PR's head commit, and branch protection on
# `main` requires that status.
#
# pull_request_target runs main's copy of this file, so a PR that edits it cannot
# change its own gate. The job never checks out the PR's code; it reads and edits
# labels and sets a status through the API.
#
# No concurrency group: a run must never be cancelled, or a new commit's run could
# be dropped before it removes the label. A label removed with GITHUB_TOKEN starts
# no new run, so the commit's run sets the failing status itself. The label's run
# sets success and then reads the label again, so every ordering of the two runs
# ends with the failing status.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review-gate:
    name: Review gate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      ACTION: ${{ github.event.action }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      CONTEXT: External review on record
    steps:
      - name: Set the review status on the head commit
        run: |
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state=success -f context="$CONTEXT" -f description="SELF-EDITED COPY"
          exit 0
