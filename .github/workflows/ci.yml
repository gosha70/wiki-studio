name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: Ruff check
        run: poetry run ruff check src/ tests/
      - name: Ruff format check
        run: poetry run ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: Mypy
        run: poetry run mypy src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: Run tests with coverage
        run: |
          poetry run pytest \
            -q -p no:cacheprovider \
            --tb=short \
            --cov=wiki_studio \
            --cov-report=term-missing \
            --cov-fail-under=92

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: pip-audit vulnerability scan
        # The core package has no runtime dependencies; this audits the dev
        # group resolved in poetry.lock, which includes the optional mcp SDK.
        run: poetry run pip-audit --skip-editable

  memkernel-compat:
    # The clean-install harness (0.7.0 FR-004): the wheel and a pinned memkernel
    # in a fresh virtual environment, and tests/integration/ driving the real
    # WikiExporter and WikiImporter against the installed wiki-studio. Separate
    # from the coverage job; memkernel is never a dependency of the package or
    # of the default dev group. Blocking since its first green run on main
    # (6d7f886, run 40430238344, recorded in docs/compatibility.md). The four
    # Release B loop cases run in the separate, non-blocking `memkernel-loop`
    # job below.
    name: memkernel integration (compat)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The memkernel revision the harness is tested against: a git ref of
      # gosha70/memkernel (main at the merge of release/0.5.0rc1, 2026-10-26).
      # Also listed in docs/compatibility.md.
      MK_GIT_REF: 641a508a2289b2d20775e6d149a0bb47678d1621
      MK_GIT_REPO: https://github.com/gosha70/memkernel.git
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - name: Build the wheel
        run: poetry build
      - name: Install the wheel, pytest and the pinned memkernel into a fresh virtual environment
        run: |
          python -m venv /tmp/compat
          /tmp/compat/bin/pip install --quiet --upgrade pip
          /tmp/compat/bin/pip install --quiet dist/*.whl pytest "memkernel @ git+${MK_GIT_REPO}@${MK_GIT_REF}"
          /tmp/compat/bin/pip check
          /tmp/compat/bin/python -c "import memkernel.wiki.sync, wiki_studio.api; print(wiki_studio.api.__file__)"
      - name: Run the clean-install harness against the installed packages
        # The import check above guarantees the suite is not skipped here.
        run: /tmp/compat/bin/python -m pytest -q -p no:cacheprovider -rs tests/integration/test_memkernel_clean_install.py

  memkernel-loop:
    # The four Release B loop cases end to end (0.7.0 FR-004, FR-032): retain,
    # export, review through api.approve, import, correct, next-session recall,
    # plus the retry property, against the same pinned memkernel. EXPECTED TO
    # FAIL until memkernel's counterpart (memkernel #48: snapshot removal and an
    # importer that reads review_state) is merged; non-blocking until then, and
    # blocking for the 0.7.0 tag only after that merge (FR-039). The cases are
    # never skipped or marked as expected failures here.
    name: memkernel Release B loop (expected to fail until memkernel #48)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      MK_GIT_REF: 641a508a2289b2d20775e6d149a0bb47678d1621
      MK_GIT_REPO: https://github.com/gosha70/memkernel.git
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - name: Build the wheel
        run: poetry build
      - name: Install the wheel, pytest and the pinned memkernel into a fresh virtual environment
        run: |
          python -m venv /tmp/loop
          /tmp/loop/bin/pip install --quiet --upgrade pip
          /tmp/loop/bin/pip install --quiet dist/*.whl pytest "memkernel @ git+${MK_GIT_REPO}@${MK_GIT_REF}"
          /tmp/loop/bin/pip check
          /tmp/loop/bin/python -c "import memkernel.wiki.sync, wiki_studio.api; print(wiki_studio.api.__file__)"
      - name: Run the Release B loop cases against the installed packages
        # The import check above guarantees the suite is not skipped here.
        run: /tmp/loop/bin/python -m pytest -q -p no:cacheprovider -rs tests/integration/test_release_b_loop.py

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: Build sdist and wheel
        run: poetry build
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/pip check
          test "$(/tmp/smoke/bin/wiki-studio --version)" = "$(poetry version -s)"
          /tmp/smoke/bin/python - <<'EOF'
          import wiki_studio.api
          from wiki_studio.lint import lint_wiki
          from wiki_studio.paths import WikiPaths
          from wiki_studio.prompt import load_schema_files
          print("All imports OK;", len(load_schema_files(WikiPaths.for_root("/tmp"))), "schema documents packaged")
          EOF
      - name: Prove the base install is standard-library only (0.8.0 FR-033)
        # The wheel without extras: every core module imports under `python -I` with
        # nothing outside the standard library in sys.modules; every Requires-Dist is
        # behind the `mcp` extra; wiki-studio-mcp without the extra exits 2 with the
        # install instruction.
        run: |
          python -m venv /tmp/base
          /tmp/base/bin/pip install --quiet dist/*.whl
          /tmp/base/bin/python -I - <<'EOF'
          import importlib, pathlib, sys
          # What the interpreter loaded at start-up (a site hook, say) is not the core's doing.
          preloaded = set(sys.modules)
          import wiki_studio
          root = pathlib.Path(wiki_studio.__file__).parent
          names = []
          for py in sorted(root.rglob("*.py")):
              rel = py.relative_to(root).with_suffix("")
              # The adapter is the extra; __main__ runs the CLI when imported.
              if rel.parts[0] == "mcp_adapter" or rel.name == "__main__":
                  continue
              parts = rel.parts[:-1] if rel.name == "__init__" else rel.parts
              names.append(".".join(("wiki_studio", *parts)))
          for name in names:
              importlib.import_module(name)
          allowed = set(sys.stdlib_module_names) | {"wiki_studio"}
          foreign = sorted(
              name for name in set(sys.modules) - preloaded
              if name.split(".")[0] not in allowed and not name.startswith("_") and name not in sys.builtin_module_names
          )
          assert not foreign, f"non-standard-library modules loaded by the core: {foreign}"
          assert "mcp" not in sys.modules and "wiki_studio.mcp_adapter" not in sys.modules
          print(f"{len(names)} core modules imported; standard library only")
          EOF
          python - <<'EOF'
          import glob, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          metadata = next(n for n in wheel.namelist() if n.endswith(".dist-info/METADATA"))
          requires = [l for l in wheel.read(metadata).decode().splitlines() if l.startswith("Requires-Dist:")]
          assert requires, "expected the mcp extra in Requires-Dist"
          bad = [l for l in requires if 'extra == "mcp"' not in l]
          assert not bad, f"Requires-Dist outside the mcp extra: {bad}"
          print("Requires-Dist:", requires)
          EOF
          set +e
          message="$(/tmp/base/bin/wiki-studio-mcp 2>&1 >/dev/null)"
          code=$?
          set -e
          test "$code" -eq 2
          test "$message" = "wiki-studio-mcp needs the mcp extra: pip install 'wiki-studio[mcp]'"
