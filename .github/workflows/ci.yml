name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: Ruff check
        run: poetry run ruff check src/ tests/
      - name: Ruff format check
        run: poetry run ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: Mypy
        run: poetry run mypy src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: Run tests with coverage
        run: |
          poetry run pytest \
            -q -p no:cacheprovider \
            --tb=short \
            --cov=wiki_studio \
            --cov-report=term-missing \
            --cov-fail-under=92

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: pip-audit vulnerability scan
        # The package has no runtime dependencies; this audits the dev
        # toolchain resolved in poetry.lock.
        run: poetry run pip-audit --skip-editable

  memkernel-compat:
    # The clean-install harness (0.7.0 FR-004): the wheel and a pinned memkernel
    # in a fresh virtual environment, and tests/integration/ driving the real
    # WikiExporter and WikiImporter against the installed wiki-studio. Separate
    # from the coverage job; memkernel is never a dependency of the package or
    # of the default dev group. Non-blocking (continue-on-error) until the job
    # is green on main, then the flag goes. The `memkernel-loop` job (the four
    # Release B loop cases) is added with the approval scope.
    name: memkernel integration (compat)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      # The memkernel revision the harness is tested against: a git ref of
      # gosha70/memkernel (main at the merge of release/0.5.0rc1, 2026-10-26).
      # Also listed in docs/compatibility.md.
      MEMKERNEL_REF: 641a508a2289b2d20775e6d149a0bb47678d1621
      MEMKERNEL_REPO: https://github.com/gosha70/memkernel.git
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - name: Build the wheel
        run: poetry build
      - name: Install the wheel, pytest and the pinned memkernel into a fresh virtual environment
        run: |
          python -m venv /tmp/compat
          /tmp/compat/bin/pip install --quiet --upgrade pip
          /tmp/compat/bin/pip install --quiet dist/*.whl pytest "memkernel @ git+${MEMKERNEL_REPO}@${MEMKERNEL_REF}"
          /tmp/compat/bin/pip check
          /tmp/compat/bin/python -c "import memkernel.wiki.sync, wiki_studio.api; print(wiki_studio.api.__file__)"
      - name: Run the clean-install harness against the installed packages
        # The import check above guarantees the suite is not skipped here.
        run: /tmp/compat/bin/python -m pytest -q -p no:cacheprovider -rs tests/integration/

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: Build sdist and wheel
        run: poetry build
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/pip check
          test "$(/tmp/smoke/bin/wiki-studio --version)" = "$(poetry version -s)"
          /tmp/smoke/bin/python - <<'EOF'
          import wiki_studio.api
          from wiki_studio.lint import lint_wiki
          from wiki_studio.paths import WikiPaths
          from wiki_studio.prompt import load_schema_files
          print("All imports OK;", len(load_schema_files(WikiPaths.for_root("/tmp"))), "schema documents packaged")
          EOF
