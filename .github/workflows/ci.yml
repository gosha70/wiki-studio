name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: Ruff check
        run: poetry run ruff check src/ tests/
      - name: Ruff format check
        run: poetry run ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: Mypy
        run: poetry run mypy src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: Run tests with coverage
        run: |
          poetry run pytest \
            -q -p no:cacheprovider \
            --tb=short \
            --cov=wiki_studio \
            --cov-report=term-missing \
            --cov-fail-under=92

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: pip-audit vulnerability scan
        # The package has no runtime dependencies; this audits the dev
        # toolchain resolved in poetry.lock.
        run: poetry run pip-audit --skip-editable

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
      - run: poetry install --no-interaction
      - name: Build sdist and wheel
        run: poetry build
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/pip check
          test "$(/tmp/smoke/bin/wiki-studio --version)" = "$(poetry version -s)"
          /tmp/smoke/bin/python - <<'EOF'
          import wiki_studio.api
          from wiki_studio.lint import lint_wiki
          from wiki_studio.paths import WikiPaths
          from wiki_studio.prompt import load_schema_files
          print("All imports OK;", len(load_schema_files(WikiPaths.for_root("/tmp"))), "schema documents packaged")
          EOF
